rules:
  - id: PHP-SQL-001
    languages: [php]
    severity: ERROR
    mode: taint
    message: >-
      Request data ($_GET, $_POST, $_REQUEST or $_COOKIE) reaches a SQL query
      without parameterization: it allows SQL injection.
    metadata:
      cwe: "CWE-89"
      owasp: "A05:2025 Injection"
      severity_hdl: critical
      confidence: high
      message_es: >-
        Datos de la petición ($_GET, $_POST, $_REQUEST o $_COOKIE) llegan a
        una consulta SQL sin parametrizar: permite inyección SQL.
      title: "SQL injection with request data (PHP)"
      recommendation: >-
        Use prepared statements (PDO::prepare or mysqli_prepare with bind_param).
        Never concatenate request data into the query.
      title_es: "Inyección SQL con datos de la petición (PHP)"
      recommendation_es: >-
        Usar sentencias preparadas (PDO::prepare o mysqli_prepare con
        bind_param). Nunca concatenar datos de la petición en la consulta.
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $_GET
              - pattern: $_POST
              - pattern: $_REQUEST
              - pattern: $_COOKIE
    pattern-sanitizers:
      - pattern: intval(...)
      - pattern: (int) $X
      - pattern: floatval(...)
      - pattern: mysqli_real_escape_string(...)
      - pattern: pg_escape_string(...)
      - pattern: pg_escape_literal(...)
      - pattern: $DB->quote(...)
      - pattern: $DB->real_escape_string(...)
    pattern-sinks:
      - pattern: mysqli_query($C, $Q, ...)
      - pattern: mysql_query($Q, ...)
      - pattern: pg_query(...)
      - pattern: $DB->query($Q, ...)
      - pattern: $DB->exec($Q)
      - pattern: $DB->multi_query($Q)
