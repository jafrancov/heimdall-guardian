rules:
  - id: NODE-SSRF-001
    languages: [javascript, typescript]
    severity: ERROR
    mode: taint
    message: >-
      Request data is used as the address of a server-side HTTP request
      (axios, fetch, got, request, http.get, needle...): this lets an
      attacker query internal services or cloud metadata (SSRF).
    metadata:
      cwe: "CWE-918"
      owasp: "A01:2025 Broken Access Control"
      severity_hdl: high
      confidence: medium
      title_es: "Solicitud del servidor a una URL controlada por la petición (SSRF, Node.js)"
      title: "Server-side request to a request-controlled URL (SSRF, Node.js)"
      recommendation_es: >-
        No aceptar URL completas del usuario. Elegir el destino de una lista
        blanca de hosts o claves, validar el esquema (solo https) y bloquear
        direcciones privadas, de loopback y de metadatos (169.254.169.254) tras
        resolver el nombre.
      recommendation: >-
        Do not accept full URLs from the user. Choose the destination from an
        allowlist of hosts or keys, validate the scheme (https only) and block
        private, loopback and metadata addresses (169.254.169.254) after
        resolving the name.
      message_es: >-
        Datos de la petición se usan como dirección de una solicitud HTTP del
        servidor (axios, fetch, got, request, http.get, needle…): permite que un
        atacante haga consultas a servicios internos o a metadatos de la nube
        (SSRF).
    pattern-sources:
      - pattern: req.query
      - pattern: req.body
      - pattern: req.params
      - pattern: req.headers
      - pattern: req.cookies
      - pattern: req.signedCookies
      - pattern: req.get(...)
      - pattern: req.header(...)
      - pattern: request.query
      - pattern: request.body
      - pattern: request.params
      - pattern: request.headers
      - pattern: request.cookies
      - pattern: ctx.query
      - pattern: ctx.params
      - pattern: ctx.request.body
      - pattern: ctx.request.query
      - patterns:
          - pattern: |
              class $C { $M(..., @$DEC(...) $X, ...) {...} }
          - metavariable-regex:
              metavariable: $DEC
              regex: ^(Query|Body|Param|Headers|Cookies)$
          - pattern-not: |
              class $C { $M(..., @$DEC(..., ParseIntPipe, ...) $X, ...) {...} }
          - pattern-not: |
              class $C { $M(..., @$DEC(..., new ParseIntPipe(...), ...) $X, ...) {...} }
          - pattern-not: |
              class $C { $M(..., @$DEC(..., ParseFloatPipe, ...) $X, ...) {...} }
          - pattern-not: |
              class $C { $M(..., @$DEC(..., new ParseFloatPipe(...), ...) $X, ...) {...} }
          - pattern-not: |
              class $C { $M(..., @$DEC(..., ParseBoolPipe, ...) $X, ...) {...} }
          - pattern-not: |
              class $C { $M(..., @$DEC(..., new ParseBoolPipe(...), ...) $X, ...) {...} }
          - pattern-not: |
              class $C { $M(..., @$DEC(..., ParseUUIDPipe, ...) $X, ...) {...} }
          - pattern-not: |
              class $C { $M(..., @$DEC(..., new ParseUUIDPipe(...), ...) $X, ...) {...} }
          - pattern-not: |
              class $C { $M(..., @$DEC(..., ParseEnumPipe(...), ...) $X, ...) {...} }
          - pattern-not: |
              class $C { $M(..., @$DEC(..., new ParseEnumPipe(...), ...) $X, ...) {...} }
          - pattern-not: |
              class $C { $M(..., @$DEC(..., ParseDatePipe, ...) $X, ...) {...} }
          - pattern-not: |
              class $C { $M(..., @$DEC(..., new ParseDatePipe(...), ...) $X, ...) {...} }
          - focus-metavariable: $X
    pattern-sanitizers:
      - pattern: encodeURIComponent(...)
      - pattern: encodeURI(...)
      - pattern: |
          `${process.env.$ENVVAR}...`
      - pattern: process.env.$ENVVAR + ...
      - pattern: |
          `${this.configService.get(...)}...`
      - pattern: |
          `${$CFG.get(...)}...`
      - patterns:
          - pattern: $X[...]
          - metavariable-regex:
              metavariable: $X
              regex: ^(?!(req|request|ctx)\b)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      - pattern: Number(...)
      - pattern: Number.parseInt(...)
      - pattern: Math.floor(...)
    pattern-sinks:
      - patterns:
          - pattern: $F($U, ...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(axios|fetch|got|request|needle|superagent|ky)$
          - pattern-not: $F({...}, ...)
          - metavariable-regex:
              metavariable: $U
              regex: (?s)^(?!\s*[`"']https?://[A-Za-z0-9.:@_-]+[/?`"']).*$
          - focus-metavariable: $U
      - patterns:
          - pattern: $LIB.$M($U, ...)
          - metavariable-regex:
              metavariable: $LIB
              regex: ^(?:.*\.)?(axios|got|request|needle|superagent|ky|http|https|\$http|httpService|axiosRef)$
          - metavariable-regex:
              metavariable: $M
              regex: ^(get|post|put|patch|delete|head|request|options|stream)$
          - pattern-not: $LIB.$M({...}, ...)
          - metavariable-regex:
              metavariable: $U
              regex: (?s)^(?!\s*[`"']https?://[A-Za-z0-9.:@_-]+[/?`"']).*$
          - focus-metavariable: $U
      - patterns:
          - pattern-either:
              - pattern: |
                  $F({..., url: $U, ...}, ...)
              - pattern: |
                  $LIB.$M({..., url: $U, ...}, ...)
              - pattern: |
                  $LIB.$M({..., baseURL: $U, ...}, ...)
          - metavariable-regex:
              metavariable: $U
              regex: (?s)^(?!\s*[`"']https?://[A-Za-z0-9.:@_-]+[/?`"']).*$
          - focus-metavariable: $U
