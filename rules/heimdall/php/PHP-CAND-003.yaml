rules:
  - id: PHP-CAND-003
    languages: [php]
    severity: INFO
    message: >-
      A file is opened with a path that is not a constant. It is only a point to review: the local AI checks whether untrusted input reaches it.
    metadata:
      candidate_kind: path
      cwe: "CWE-22"
      owasp: "A01:2025 Broken Access Control"
      severity_hdl: medium
      confidence: low
      message_es: >-
        Se abre un archivo con una ruta que no es constante. Es solo un punto por revisar: la IA local comprueba si le llega entrada no confiable.
      title: "File path from a variable (to review)"
      recommendation: >-
        Resolve the path against a fixed base folder and reject any result that falls outside it.
      title_es: "Ruta de archivo desde una variable (por revisar)"
      recommendation_es: >-
        Resuelve la ruta contra una carpeta base fija y rechaza cualquier resultado que quede fuera de ella.
    patterns:
      - pattern-either:
          - pattern: fopen($X, ...)
          - pattern: file_get_contents($X, ...)
          - pattern: readfile($X, ...)
          - pattern: unlink($X)
          - pattern: include $X
          - pattern: include_once $X
          - pattern: require $X
          - pattern: require_once $X
      - pattern-not: fopen("...", ...)
      - pattern-not: file_get_contents("...", ...)
      - pattern-not: readfile("...", ...)
      - pattern-not: unlink("...")
      - pattern-not: include "..."
      - pattern-not: include_once "..."
      - pattern-not: require "..."
      - pattern-not: require_once "..."
      - pattern-not: include __DIR__ . "..."
      - pattern-not: include_once __DIR__ . "..."
      - pattern-not: require __DIR__ . "..."
      - pattern-not: require_once __DIR__ . "..."
