name: Release

# Cuts the command-line release: light wheel, installer script, server archive and checksums,
# attached to a DRAFT GitHub release that the owner reviews and publishes by hand.
# The desktop installers (DMG, exe, deb) are NOT built or attached here: build.yml makes them
# on manual trigger, and the owner attaches them to the draft after testing them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: The tag matches the version in pyproject.toml
        id: version
        shell: bash
        run: |
          version="$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}"
            exit 1
          fi
      - run: uv run python tools/fetch_tools.py opengrep gitleaks
      # The same QA as CI: hygiene, ruff, mypy and pytest with coverage.
      - run: uvx pre-commit run --all-files --show-diff-on-failure
        env:
          HDL_REQUIRE_RULE_ENGINE: "1"
      - run: make cli-wheel
      - run: make cli-archive
      # No sdist: it would not carry the generated _bundle/ (rules, legal files), so a build from
      # it would differ from the wheel. The light wheel is what gets published.
      - name: Release notes and checksums
        shell: bash
        run: |
          mkdir -p release
          uv run python tools/changelog_section.py "${{ steps.version.outputs.version }}" > release/NOTES.md
          cp dist/cli/*.whl packaging/cli/install_hdl.py dist/heimdall-guardian-cli-*.tar.gz release/
          (cd release && sha256sum -- *.whl install_hdl.py *.tar.gz > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release/*
          if-no-files-found: error
          retention-days: 7

  draft:
    name: Draft GitHub release
    # Only for tags: a manual run builds and checks but publishes nothing.
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          name: Heimdall Guardian ${{ needs.build.outputs.version }}
          body_path: release/NOTES.md
          files: |
            release/*.whl
            release/install_hdl.py
            release/*.tar.gz
            release/SHA256SUMS
          fail_on_unmatched_files: true

  pypi:
    name: Publish to PyPI
    # Opt-in: set the repository variable PUBLISH_PYPI to "true" after configuring the
    # trusted publisher on PyPI (see CONTRIBUTING.md).
    if: github.ref_type == 'tag' && vars.PUBLISH_PYPI == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release
      - name: Only the wheel goes to PyPI
        run: mkdir upload && cp release/*.whl upload/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: upload
