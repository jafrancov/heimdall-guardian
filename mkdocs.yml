site_name: Heimdall Guardian
site_description: Local, read-only static security analysis of source code.
site_url: https://jafrancov.github.io/heimdall-guardian/
repo_url: https://github.com/jafrancov/heimdall-guardian
repo_name: jafrancov/heimdall-guardian
edit_uri: ""
copyright: Copyright 2026 Alejandro Franco. Apache-2.0.

theme:
  name: material
  language: en
  logo: assets/emblema.png
  favicon: assets/icono.png
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Dark mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: es
          name: Español
          build: true
          nav_translations:
            Home: Inicio
            Getting started: Primeros pasos
            Desktop app tour: Recorrido por la app
            Automation and CI: Automatización y CI
            Configuration: Configuración
            Your own rules: Tus propias reglas
            Local AI: IA local
            What it checks: Qué revisa
            Supported stacks: Stacks soportados
            Rules catalog: Catálogo de reglas
            Reviewing findings: Revisar hallazgos
            CLI reference: Referencia de la línea de comandos
            Contributing: Contribuir
            Changelog: Registro de cambios

validation:
  omitted_files: info
  absolute_links: warn
  unrecognized_links: warn

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Desktop app tour: app-tour.md
  - What it checks: checks.md
  - Reviewing findings: reviewing.md
  - Local AI: local-ai.md
  - Configuration: configuration.md
  - Your own rules: custom-rules.md
  - Supported stacks: stacks.md
  - Rules catalog: rules/index.md
  - Automation and CI:
      - CLI reference: cli.md
  - Contributing: contributing.md
  - Changelog: changelog.md
