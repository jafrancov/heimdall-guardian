rules:
  - id: DART-CRY-001
    languages: [dart]
    severity: WARNING
    message: >-
      Weak cryptography: MD5 or SHA-1 applied to passwords, Random()
      (non-cryptographic) used to generate tokens, passwords, codes or
      nonces, AES encryption in ECB mode, or a fixed initialization vector.
      Passwords can be brute-forced, random values can be predicted, and a
      repeated IV reveals patterns in the ciphertext.
    metadata:
      cwe: "CWE-327"
      owasp: "A04:2025 Cryptographic Failures"
      severity_hdl: medium
      confidence: medium
      title_es: "Criptografía débil o aleatoriedad predecible (Dart/Flutter)"
      title: "Weak cryptography or predictable randomness (Dart/Flutter)"
      recommendation_es: >-
        Para contraseñas, usar un algoritmo lento con sal (argon2, bcrypt o
        scrypt) en el servidor. Para tokens, códigos y nonces, Random.secure().
        Para cifrar, AES en modo GCM (o CBC con HMAC) con un IV aleatorio nuevo
        por mensaje (IV.fromSecureRandom(16)); nunca ECB ni IV fijos.
      recommendation: >-
        For passwords, use a slow salted algorithm (argon2, bcrypt or scrypt)
        on the server. For tokens, codes and nonces, use Random.secure(). For
        encryption, use AES in GCM mode (or CBC with HMAC) with a new random
        IV per message (IV.fromSecureRandom(16)); never ECB or fixed IVs.
      message_es: >-
        Criptografía débil: MD5 o SHA-1 aplicados a contraseñas, Random() (no
        criptográfico) para generar tokens, contraseñas, códigos o nonces,
        cifrado AES en modo ECB o vector de inicialización fijo. Las contraseñas
        se descifran por fuerza bruta, los valores aleatorios se predicen y un IV
        repetido revela patrones del texto cifrado.
    patterns:
      - pattern-either:
          - patterns:
              - pattern: $H.convert($X, ...)
              - metavariable-regex:
                  metavariable: $H
                  regex: ^(md5|sha1)$
              - metavariable-regex:
                  metavariable: $X
                  regex: (?i)^.*(passw|pwd|contrase|clave).*$
          - patterns:
              - pattern-either:
                  - pattern: Random()
                  - pattern: Random($S)
              - pattern-inside: |
                  $F(...) { ... }
              - metavariable-regex:
                  metavariable: $F
                  regex: (?i)^.*(token|passw|pwd|secret|otp|nonce|salt|apikey|codigo|session|sesion).*$
          - pattern: AESMode.ecb
          - pattern: IV.fromLength(...)
          - patterns:
              - pattern-either:
                  - pattern: IV.fromUtf8($X)
                  - pattern: IV.fromBase64($X)
              - metavariable-regex:
                  metavariable: $X
                  regex: ^[rR]?["']
