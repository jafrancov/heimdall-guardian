rules:
  - id: DJ-CAND-003
    languages: [python]
    severity: INFO
    message: >-
      A file is opened with a path that is not a constant. It is only a point to review: the local AI checks whether untrusted input reaches it.
    metadata:
      candidate_kind: path
      cwe: "CWE-22"
      owasp: "A01:2025 Broken Access Control"
      severity_hdl: medium
      confidence: low
      message_es: >-
        Se abre un archivo con una ruta que no es constante. Es solo un punto por revisar: la IA local comprueba si le llega entrada no confiable.
      title: "File path from a variable (to review)"
      recommendation: >-
        Resolve the path against a fixed base folder and reject any result that falls outside it.
      title_es: "Ruta de archivo desde una variable (por revisar)"
      recommendation_es: >-
        Resuelve la ruta contra una carpeta base fija y rechaza cualquier resultado que quede fuera de ella.
    patterns:
      - pattern-either:
          - pattern: open($X, ...)
          - pattern: FileResponse(open($X, ...), ...)
          - pattern: os.path.join($BASE, $X, ...)
          - pattern: send_file($X, ...)
      - pattern-not: open("...", ...)
      - pattern-not: os.path.join(..., "...")
      - pattern-not: send_file("...", ...)
      - pattern-not-inside: |
          with open("...", ...) as $F:
              ...
      - pattern-either:
          - pattern-inside: |
              def $F($REQUEST, ...):
                  ...
          - pattern-inside: |
              def $F(self, $REQUEST, ...):
                  ...
