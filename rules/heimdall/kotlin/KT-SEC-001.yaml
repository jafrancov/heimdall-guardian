rules:
  - id: KT-SEC-001
    languages: [regex]
    severity: ERROR
    message: >-
      Hard-coded secret: a constant named like an API key, secret, token or
      password is assigned a fixed string. Anyone who has the application
      (an APK can be decompiled in minutes) or the repository can extract
      it.
    metadata:
      cwe: "CWE-798"
      owasp: "A07:2025 Authentication Failures"
      severity_hdl: high
      confidence: medium
      title_es: "Llave de API, secreto o contraseña escrita en el código (Kotlin/Android)"
      title: "Hard-coded API key, secret or password (Kotlin/Android)"
      recommendation_es: >-
        Quitar el valor del código y rotarlo si ya se publicó. Un secreto de
        servidor no debe viajar en la aplicación: usar un servicio propio que
        lo guarde. Si es una llave pública de cliente, restringirla en el
        proveedor por paquete y huella de firma, e inyectarla en la
        compilación desde local.properties o variables de entorno que no se
        suban al repositorio.
      recommendation: >-
        Remove the value from the code and rotate it if it was already
        published. A server secret must not ship in the application: use your
        own service that stores it. If it is a public client key, restrict it
        at the provider by package and signing fingerprint, and inject it at
        build time from local.properties or environment variables that are not
        committed to the repository.
      message_es: >-
        Secreto escrito en el código: una constante con nombre de llave de API,
        secreto, token o contraseña recibe un texto fijo. Quien tenga la
        aplicación (un APK se descompila en minutos) o el repositorio puede
        extraerlo.
    paths:
      include:
        - "*.kt"
        - "*.kts"
        - "*.gradle"
    pattern-either:
      - pattern-regex: >-
          (?m)^(?![ \t]*//)[^\n]*?(?i)\b(?!\w*(?:label|hint|text|title|type|url|path|field|header|name|storage|prefs|route|regex|pattern|error|message|(?:token|passw(?:or)?d|pwd|secret)_?key|keystore|identifier|extra|param|tag_|_tag))[a-z0-9_]*(?:api_?key|secret|passw(?:or)?d|pwd|token|private_?key)[a-z0-9_]*(?:\s*:\s*[a-z]+\??\s*=|\s*[:=])\s*(")(?!(?:(?-i:[a-z]+(?:_[a-z]+)+|[A-Z]+(?:_[A-Z]+)+)\1)|(?-i:[a-z]+(?:\.[A-Za-z0-9]+){2,})\1|[^"]*(?:change_?me|your|xxx|example|todo|placeholder|<|\.\.\.))[^\s"$\\]{8,}\1
      - pattern-regex: >-
          (?m)^(?![ \t]*//)[^\n]*?\bbuildConfigField\(\s*"String"\s*,\s*"[A-Z0-9_]*(?i:api_?key|secret|passw(?:or)?d|pwd|token|private_?key)[A-Z0-9_]*"\s*,\s*"\\"(?![^"\\]*(?i:change_?me|your|xxx|example|todo|placeholder))[^\s"\\$]{8,}\\"
