[project]
name = "heimdall-guardian"
version = "1.0.0"
description = "Heimdall Guardian: local, read-only static security analysis of source code"
dynamic = ["readme"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*"]
authors = [{ name = "Alejandro Franco" }]
requires-python = ">=3.12"
keywords = ["security", "sast", "secrets", "sbom", "static-analysis"]
dependencies = [
    "bandit>=1.8",
    "fpdf2>=2.8.9",
    "jinja2>=3.1.6",
    "keyring>=25.7.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Natural Language :: Spanish",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]

[project.optional-dependencies]
# The desktop interface is optional: the `hdl` command line runs without it.
ui = ["flet>=1.1.3"]

[project.urls]
Homepage = "https://jafrancov.github.io/heimdall-guardian/"
Documentation = "https://jafrancov.github.io/heimdall-guardian/"
Repository = "https://github.com/jafrancov/heimdall-guardian"
Issues = "https://github.com/jafrancov/heimdall-guardian/issues"
Changelog = "https://github.com/jafrancov/heimdall-guardian/blob/main/CHANGELOG.md"
Security = "https://github.com/jafrancov/heimdall-guardian/security/policy"

[project.scripts]
hdl = "heimdall_guardian.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.17",
    "types-openpyxl>=3.1.5.20260827",
    "flet[all]>=1.1.3",
    "ds-store>=1.3.3",
    "mac-alias>=2.2.3",
    "pillow>=13",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
    "mkdocs-static-i18n>=1.3,<2",
]

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme>=25.1"]
build-backend = "hatchling.build"

# The PyPI page shows README.md, whose links and images are relative to the repository.
# At build time they become absolute (images from raw.githubusercontent.com, the rest to
# github.com), so they work on PyPI too; README.md itself stays as GitHub shows it.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'src="(?!https?://)([^"]+)"'
replacement = 'src="https://raw.githubusercontent.com/jafrancov/heimdall-guardian/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+\.(?:png|jpg|jpeg|gif|svg))\)'
replacement = '](https://raw.githubusercontent.com/jafrancov/heimdall-guardian/main/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/jafrancov/heimdall-guardian/blob/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/heimdall_guardian"]
# Rules and binaries copied by tools/build_bundle.py: they are not versioned, but
# they ship inside the package so it works without the repository or internet.
artifacts = ["src/heimdall_guardian/_bundle/**"]

[tool.flet]
product = "Heimdall Guardian"
org = "io.github.jafrancov"
copyright = "Copyright 2026 Alejandro Franco. Apache-2.0 license."

[tool.flet.app]
path = "src"

# `flet build` reads `project.dependencies` plus these per-platform lists; since Flet is only
# an optional extra of the package, the installers must name it explicitly. Pinned to the
# version in uv.lock: the build template must match the Python package it ships with.
[tool.flet.macos]
dependencies = ["flet==1.1.3"]

[tool.flet.windows]
dependencies = ["flet==1.1.3"]

[tool.flet.linux]
dependencies = ["flet==1.1.3"]

[tool.ruff]
line-length = 100
target-version = "py312"
# .md files are excluded: ruff would reformat their Python blocks.
extend-exclude = ["tests/fixtures", "tests/rules/fixtures", "examples/demo-project", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "C90", "PT", "RET", "SIM", "S", "RUF"]
# S603/S607: adapters launch external binaries on purpose, always without a shell.
ignore = ["S603", "S607"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
# The substitution table deliberately lists typographic quotes and dashes.
"src/heimdall_guardian/report/pdf.py" = ["RUF001"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["bandit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
norecursedirs = ["examples", "tests/fixtures", "tests/rules/fixtures", "tests/corpus"]
filterwarnings = ["error", "ignore:The verify_requirements argument:DeprecationWarning"]

[tool.coverage.run]
source = ["heimdall_guardian"]
branch = true
# The Flet window needs a graphical session; what decides what is shown
# lives in ui/model.py, which is tested.
omit = ["*/heimdall_guardian/ui/app.py", "*/heimdall_guardian/ui/__main__.py"]

[tool.coverage.report]
# Minimum total coverage. The integration tests (tests/integration) run the real
# binaries but are skipped when they are missing, so the floor stays at 75 %.
fail_under = 75
show_missing = true
skip_covered = true
